name: PDB parser regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sanitizer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure GKlib with sanitizers
        run: >-
          cmake -S GKlib -B build-parser
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build parser tests
        run: cmake --build build-parser --target pdb_parser --parallel 2
      - name: Run parser tests
        run: ctest --test-dir build-parser --output-on-failure
